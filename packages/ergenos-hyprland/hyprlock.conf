general {
    hide_cursor = true
}
background {
    monitor =
    path = /usr/share/ergenos-hyprland/wallpaper.png
    blur_passes = 2
    blur_size = 5
}
label {
    monitor =
    text = $TIME
    color = rgba(eaf3ffff)
    font_size = 72
    font_family = Inter
    position = 0, 120
    halign = center
    valign = center
}
label {
    monitor =
    text = ErgenOS · $USER
    color = rgba(9db0c8ff)
    font_size = 16
    font_family = Inter
    position = 0, 32
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 300, 54
    outline_thickness = 2
    outer_color = rgba(0aa7ffcc)
    inner_color = rgba(081424ff)
    font_color = rgba(eaf3ffff)
    check_color = rgba(54c3ffff)
    fail_color = rgba(ff7c86ff)
    placeholder_text = Password
    fail_text = Authentication failed
    rounding = 14
    position = 0, -50
    halign = center
    valign = center
}
