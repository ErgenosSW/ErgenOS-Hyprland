name: Preview regression tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install test tools
        run: pacman -Syu --noconfirm python python-jsonschema lua cliphist systemd desktop-file-utils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check source syntax
        working-directory: packages/ergenos-hyprland
        run: |
          for script in notification-session-check ergenos-hyprland-session session-services ergenos-hyprland-menu ergenos-hyprland-screenshot; do
            bash -n "$script"
          done
          luac -p hyprland.lua
          desktop-file-validate ergenos-hyprland.desktop
      - name: Run preview regression suite
        working-directory: packages/ergenos-hyprland
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -p 'test_*.py' -v
